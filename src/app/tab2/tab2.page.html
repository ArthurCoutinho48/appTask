<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>Programação</ion-title>

    <ion-buttons slot="end">
      <ion-button color="medium">
        <ion-icon  name="ellipse" class="large-icon"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding">
    <h4 class="p-4">Tarefas do dia</h4>
  
    <ion-grid fixed>
      <ion-row *ngFor="let task of tasks">
        <!--Card 01-->
        <ion-col size="12">
          <ion-card class="dark">
            <ion-card-header>
              <div class="teste">
                <!--<ion-checkbox></ion-checkbox>-->
                <ion-card-title>{{task.title}}</ion-card-title>
              </div>
             
              <ion-card-subtitle class="task-card"> 
                <div>
                  <ion-icon name="remove-circle-outline" class="fl" id="pd"></ion-icon>
                  <p>Pendente</p>
                </div>
                <div>
                  <ion-icon name="stopwatch-outline" class="fl"></ion-icon>
                  <p>04/06/25</p>
                </div>
              </ion-card-subtitle>
            </ion-card-header>

            <ion-card-content>
              <p>{{task.content}}</p>
            </ion-card-content>
          </ion-card>
        </ion-col>
