<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding">

    <ion-item button lines="none">
      <ion-avatar slot="start" class="dark">
        <img [src]="avatarUrl"/>
      </ion-avatar>
      <ion-label>
        {{userName}}
      </ion-label>
    </ion-item>

    <h4 class="p-4">Configurações</h4>

    <ion-item button lines="none" class="badge-item" (click)="alterarNomeUsuario()">
      <ion-avatar slot="start" class="dark logoutPai">
        <ion-icon name="person-circle-outline" class="logoutFilho"></ion-icon>
      </ion-avatar>
      <ion-label>
        Alterar Usuário
      </ion-label>
    </ion-item>

    <ion-item button lines="none" class="badge-item" (click)="alterarSenha()">
      <ion-avatar slot="start" class="dark logoutPai">
        <ion-icon name="lock-open-outline" class="logoutFilho"></ion-icon>
      </ion-avatar>
      <ion-label>
        Alterar Senha
      </ion-label>
    </ion-item>

    <ion-item button lines="none" class="badge-item" (click)="logout()">
      <ion-avatar slot="start" class="dark logoutPai">
        <ion-icon name="exit-outline" class="logoutFilho"></ion-icon>
      </ion-avatar>
      <ion-label>
        Sair desta conta
      </ion-label>
    </ion-item>
  </div>
</ion-content>
