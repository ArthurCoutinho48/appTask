<ion-content [fullscreen]="true">

  <div class="header">
    <ion-title class="title">Welcome</ion-title>
    <p class="subTitle">Cadastre-se para criar sua conta</p>
  </div>

  <form [formGroup]="regForm" novalidate>
    <div class="ion-padding">
      <ion-item>
        <ion-input formControlName="fullname" type="text" placeholder="Usuário" class="input"></ion-input>
        <ion-icon name="person-outline"></ion-icon>
      </ion-item>
      <div class="erroControl" *ngIf="regForm.controls?.['fullname']?.touched && regForm.controls?.['fullname']?.invalid">
        <ion-text *ngIf="errorControl['fullname']?.errors?.['required']">
          Fullname is required
        </ion-text>
      </div>

      <ion-item>
        <ion-input formControlName="email" type="email" placeholder="Email" class="input"></ion-input>
        <ion-icon name="mail-outline"></ion-icon>
      </ion-item>
      <div class="erroControl" *ngIf="regForm.controls?.['email']?.touched && regForm.controls?.['email']?.invalid">
        <ion-text *ngIf="errorControl['email']?.errors?.['required']">
          Email is required
        </ion-text>

        <ion-text *ngIf="errorControl['email']?.errors?.['pattern']">
          Email should be valid
        </ion-text>
      </div>

      <ion-item>
        <ion-input formControlName="password" type="password" placeholder="Senha" class="input"></ion-input>
        <ion-icon name="lock-closed-outline"></ion-icon>
      </ion-item>
      <div class="erroControl" *ngIf="regForm.controls?.['password']?.touched && regForm.controls?.['password']?.invalid">
        <ion-text *ngIf="errorControl['password']?.errors?.['required']">
          Password is required
        </ion-text>

        <ion-text *ngIf="errorControl['password']?.errors?.['pattern']">
          Password must atleast have
          One Character
          One Capital Letter
          One number
          Contain 8 digit
        </ion-text>
      </div>

      <div class="loginButton">
        <ion-button (click)="signUp()">Cadastrar</ion-button>
      </div>
      
      <div class="signupLink">
        <p>Já tem conta?<a [routerLink]="['/login']">Faça login agora</a></p>
      </div>

    </div>
  </form>
