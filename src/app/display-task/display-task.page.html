<ion-content [fullscreen]="true">
  
  <div class="ion-padding">

    <ion-grid fixed *ngIf="task">

      <ion-row>

        <!--Card 01-->
        <ion-col size="12">
          <ion-card class="dark">
            <ion-card-header>
              <ion-card-title>
                <ion-item>
                  <ion-input 
                    [(ngModel)]="task.title"
                    class="input"
                    type="text"
                    placeholder="título">
                  </ion-input>  
                </ion-item>
              </ion-card-title>
              <ion-card-subtitle class="cardSubTitle">
                <div class="cardSubTitleRight">
                  <ion-icon name="stopwatch-outline" class="fl"></ion-icon>
                  
                    <ion-item>
                      <ion-input 
                        [(ngModel)]="task.createdAt"
                        class="input"
                        type="text"
                        placeholder="dd/mm/aaaa"
                        maxlength="10"
                        (ionInput)="formatarData($event)">
                      </ion-input>
                    </ion-item>
                </div>
              </ion-card-subtitle>
            </ion-card-header>

            <ion-card-content>
              <ion-item>
                <ion-textarea 
                  [(ngModel)]="task.content"
                  class="input"
                  [autoGrow]="true"
                  placeholder="adicione uma descrição">
                </ion-textarea>
              </ion-item>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>

    </ion-grid>
   
    <div>
      <ion-button id="verde" (click)="concTask(task)">Realizado</ion-button>
      <ion-button id="cinza" (click)="updateTask()">Alterar</ion-button>
      <ion-button id="vermelho" (click)="deleteTask()">Excluir</ion-button>
    </div>
  </div>
  
</ion-content>
